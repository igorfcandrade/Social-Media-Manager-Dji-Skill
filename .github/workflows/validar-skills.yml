name: Validar skills

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Executar testes portáteis
        run: |
          python3 -m venv /tmp/smm-test-env
          /tmp/smm-test-env/bin/pip install Pillow
          PATH="/tmp/smm-test-env/bin:$PATH" ./testar.sh
